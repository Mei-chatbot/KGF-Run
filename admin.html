<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>KGF Run admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#000;color:#F6F2E7;font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
    main{width:100%;max-width:380px;padding:24px}
    img{width:200px;display:block;margin-bottom:22px}
    h1{margin:0 0 6px;font:italic 800 36px/1 'Arial Narrow',Impact,sans-serif}
    p{color:#A29C8B;margin:0 0 20px}
    input{width:100%;height:54px;padding:0 14px;box-sizing:border-box;background:#131313;color:#F6F2E7;border:2px solid #2a2a2a;border-radius:4px;font-size:18px;margin-bottom:14px}
    input:focus{outline:none;border-color:#F7B500}
    button{width:100%;height:54px;border:0;border-radius:3px;background:#ff5a4d;color:#000;font:italic 800 22px 'Arial Narrow',Impact,sans-serif;cursor:pointer}
    #msg{margin-top:16px;min-height:22px}
    .ok{color:#3ddc84}.err{color:#ff5a4d}
  </style>
</head>
<body>
<main>
  <img src="/icons/logo-600.png" alt="KGF">
  <h1>Clear the map</h1>
  <p>Removes every runner from the live map. People with the app open will reappear on their next update.</p>
  <input id="key" type="password" placeholder="Admin key" autocomplete="off">
  <button id="go" type="button">Clear all runners</button>
  <div id="msg"></div>
</main>
<script>
  const msg = document.getElementById('msg');
  document.getElementById('go').addEventListener('click', async () => {
    const key = document.getElementById('key').value;
    if (!key) { msg.className = 'err'; msg.textContent = 'Enter the admin key.'; return; }
    if (!confirm('Remove all runners from the map?')) return;
    try {
      const r = await fetch('/api/runners?all=1', { method: 'DELETE', headers: { 'x-admin-key': key } });
      const d = await r.json();
      msg.className = r.ok ? 'ok' : 'err';
      msg.textContent = r.ok ? 'Done. The map is clear.' : (d.error || 'Failed.');
    } catch (e) { msg.className = 'err'; msg.textContent = 'No connection.'; }
  });
</script>
</body>
</html>
